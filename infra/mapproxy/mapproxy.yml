services:
  demo:
  tms:
    use_grid_names: true
    origin: 'nw'
  wmts:
  wms:
    srs: ['EPSG:2056', 'EPSG:3857', 'EPSG:4326']
    md:
      title: Swiss Digital Twin Proxy

layers:
  - name: ch.swisstopo.swissimage
    title: SwissIMAGE Aerial
    sources: [swissimage_cache]

  - name: ch.swisstopo.swissalti3d-reliefschattierung
    title: SwissAlti3D Hillshade
    sources: [swissalti3d_cache]

  - name: avalanch.hs_latest
    title: AvalanCH Snow Height Latest
    sources: [avalanch_hs_cache]

  - name: avalanch.danger_latest
    title: AvalanCH Danger Latest
    sources: [avalanch_danger_cache]

caches:
  swissimage_cache:
    grids: [lv95_grid]
    sources: [swissimage_wms]
    cache:
      type: file
      directory: /mapproxy/cache_data/swissimage

  swissalti3d_cache:
    grids: [lv95_grid]
    sources: [swissalti3d_wms]
    cache:
      type: file
      directory: /mapproxy/cache_data/swissalti3d

  avalanch_hs_cache:
    grids: [lv95_grid]
    sources: [avalanch_hs_wms]
    cache:
      type: file
      directory: /mapproxy/cache_data/avalanch_hs

  avalanch_danger_cache:
    grids: [lv95_grid]
    sources: [avalanch_danger_wms]
    cache:
      type: file
      directory: /mapproxy/cache_data/avalanch_danger

sources:
  swissimage_wms:
    type: wms
    req:
      url: https://wms.geo.admin.ch/
      layers: ch.swisstopo.swissimage
      transparent: true
    supported_srs: ['EPSG:2056']

  swissalti3d_wms:
    type: wms
    req:
      url: https://wms.geo.admin.ch/
      layers: ch.swisstopo.swissalti3d-reliefschattierung
      transparent: true
    supported_srs: ['EPSG:2056']

  avalanch_hs_wms:
    type: wms
    req:
      url: http://geoserver:8080/geoserver/avalanch/wms
      layers: avalanch:hs_latest
      transparent: true
    supported_srs: ['EPSG:2056']

  avalanch_danger_wms:
    type: wms
    req:
      url: http://geoserver:8080/geoserver/avalanch/wms
      layers: avalanch:danger_latest
      transparent: true
    supported_srs: ['EPSG:2056']

grids:
  lv95_grid:
    srs: 'EPSG:2056'
    bbox: [2420000.0, 1030000.0, 2900000.0, 1350000.0]
    bbox_srs: 'EPSG:2056'
    origin: nw
    resolutions: [4000, 2000, 1000, 500, 250, 100, 50, 25, 10, 5, 2.5, 1, 0.5, 0.25, 0.1]
