events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;

    # Rate limit sur les APIs sortantes, surtout Swiss Open Data
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream api_backend {
        server api:8000;
    }

    upstream tiles_backend {
        server mapproxy:8080;
    }

    upstream client_frontend {
        server client-web:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://client_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        location /tiles/ {
            proxy_pass http://tiles_backend;
            proxy_cache_bypass $http_upgrade;
            add_header 'Access-Control-Allow-Origin' '*';
        }
    }
}
