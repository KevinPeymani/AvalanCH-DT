services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiss_broker
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: simulation_secure
    networks:
      - swiss-net

