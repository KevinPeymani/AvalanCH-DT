  worker-sim:
    build: ./services/compute-worker
    image: swiss_worker_img
    restart: unless-stopped
    environment:
     - BROKER_URL=amqp://admin:simulation_secure@swiss_broker:5672/
     - WORKER_TYPE=simulation
     - SIM_QUEUE=simulation_queue
     - INGEST_QUEUE=ingestion_queue
    depends_on:
     - rabbitmq
    networks:
      - swiss-net
    volumes:
      - ./services/compute-worker/data:/data
      - ./services/compute-worker/examples:/examples

  worker-ingest:
    image: swiss_worker_img
    restart: unless-stopped
    networks:
      - swiss-net
    environment:
      - BROKER_URL=amqp://admin:simulation_secure@swiss_broker:5672/
      - WORKER_TYPE=ingestion
      - SIM_QUEUE=simulation_queue
      - INGEST_QUEUE=ingestion_queue
    depends_on:
      - rabbitmq
    volumes:
      - ./services/compute-worker/data:/data
      - ./services/compute-worker/examples:/examples
# 
#   worker-grid:
#     build: ./services/grid-service
#     image: swiss_grid_worker_img
