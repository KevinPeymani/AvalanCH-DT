[project]
name = "avaframe-service"
version = "0.1.0"
description = "AvaFrame-based avalanche simulation service"
requires-python = ">=3.10"

dependencies = [
  "fastapi==0.110.0",
  "uvicorn[standard]==0.27.1",
  "aio-pika==9.4.1",
  "pydantic==2.6.1",

  # Optional DB deps (remove if unused)
  "sqlalchemy==2.0.27",
  "asyncpg==0.29.0",

  # AvaFrame deps
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "python-dotenv",

  # AvaFrame from git (PIN THIS!)
  "avaframe @ git+https://github.com/avaframe/AvaFrame.git@2.0b2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
