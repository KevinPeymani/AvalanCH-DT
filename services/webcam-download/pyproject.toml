[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-fetcher"
version = "0.1.0"
description = "Webcam ingestion service for avalanche detection"
authors = [
    { name = "Kevin" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests==2.32.3",
    "PyYAML==6.0.2",
    "Pillow==10.4.0",
    "pika==1.3.2"
]

[tool.setuptools.packages.find]
where = ["app"]
